[package]
name = "iamai-core"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Rust core for the iamai runtime framework."

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.27.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
