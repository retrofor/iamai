[project]
# FOSSA uses this isolated lock to resolve only the package's declared runtime dependencies.
name = "iamai-fossa-production"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7,<1",
    "pydantic>=2.11,<3",
    "tomli>=2.0,<3",
    "websockets>=15,<16",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []
